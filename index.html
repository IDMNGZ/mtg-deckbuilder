<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Deck Builder</title>
<meta name="theme-color" content="#0a0c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MTG Deck">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="css/landing.css">
<script src="js/landing-backgrounds.js"></script>
<script>
  // Runs before the body paints, so there's no flash of the fallback background
  // before swapping to the randomly chosen one.
  (function () {
    if (typeof LANDING_BACKGROUNDS === "undefined" || LANDING_BACKGROUNDS.length === 0) return;
    var choice = LANDING_BACKGROUNDS[Math.floor(Math.random() * LANDING_BACKGROUNDS.length)];
    // Resolve to an absolute URL against this page's location before handing it to CSS -
    // a relative url() inside a custom property resolves against whichever stylesheet
    // consumes it (css/landing.css), not where the value was set, which would otherwise
    // silently point at the wrong folder.
    var absoluteUrl = new URL(choice, location.href).href;
    document.documentElement.style.setProperty("--landing-bg", "url('" + absoluteUrl + "')");
  })();
</script>
</head>
<body class="landing-page">
  <main>
    <h1 class="landing-title">Magic The Gathering<br>Deck Builder</h1>
    <p class="landing-subtitle">Created by Ian Dominguez</p>
    <a href="app.html" class="landing-enter-btn">Enter App</a>
  </main>
  <div class="landing-version">v0.1.0</div>
</body>
</html>
