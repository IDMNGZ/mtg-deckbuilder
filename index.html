<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Deck Builder</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="app-header">
  <h1>MTG Deck Builder</h1>
  <nav class="tabs">
    <a href="#browse" class="tab-link" data-tab="browse">Browse</a>
    <a href="#collection" class="tab-link" data-tab="collection">Collection</a>
    <a href="#deckbuilder" class="tab-link" data-tab="deckbuilder">Deck Builder</a>
    <a href="#decks" class="tab-link" data-tab="decks">My Decks</a>
  </nav>
  <div class="header-actions">
    <button id="btn-export" class="btn btn-ghost" title="Download your owned cards + decks as a JSON backup">Export</button>
    <button id="btn-import" class="btn btn-ghost" title="Load a JSON backup">Import</button>
    <input type="file" id="file-import" accept="application/json" hidden>
  </div>
</header>

<main id="app">

  <section id="tab-browse" class="tab-panel">
    <div class="sticky-controls">
      <div class="browse-controls">
        <div class="field edition-picker">
          Editions
          <div class="input-clear-wrap">
            <input type="text" id="edition-search" placeholder="Search editions (e.g. 'Lord of the Rings')…" autocomplete="off">
            <button type="button" id="edition-search-clear" class="input-clear-btn" title="Clear">&times;</button>
          </div>
          <div id="edition-checklist" class="edition-checklist hidden">
            <div class="edition-checklist-actions">
              <span id="edition-match-count"></span>
              <span>
                <button type="button" id="btn-select-all-matching" class="btn btn-ghost">Select all matches</button>
                <button type="button" id="btn-clear-editions" class="btn btn-ghost">Clear</button>
              </span>
            </div>
            <div id="edition-checklist-rows"></div>
          </div>
        </div>
        <label class="field field-grow">
          Filter cards
          <div class="input-clear-wrap">
            <input type="text" id="browse-filter" placeholder="Search name or type…">
            <button type="button" id="browse-filter-clear" class="input-clear-btn" title="Clear">&times;</button>
          </div>
        </label>
        <label class="field">
          Sort by
          <select id="browse-sort">
            <option value="">Default order</option>
            <option value="cmc-asc">Mana Cost: Low → High</option>
            <option value="cmc-desc">Mana Cost: High → Low</option>
          </select>
        </label>
        <button id="btn-refresh-set" class="btn btn-ghost" title="Re-fetch the selected edition(s) from Scryfall">Refresh</button>
        <span id="browse-status" class="status-text"></span>
        <label class="field field-grow global-search-field">
          Search any card by name (all editions)
          <div class="input-clear-wrap">
            <input type="text" id="global-card-search" placeholder="Don't know the edition? Search by name…" autocomplete="off">
            <button type="button" id="global-card-search-clear" class="input-clear-btn" title="Clear">&times;</button>
          </div>
        </label>
      </div>
      <div id="edition-chips" class="edition-chips"></div>
      <hr class="controls-divider">
      <div id="browse-type-filters" class="type-filter-row"></div>
      <div id="browse-color-filters" class="type-filter-row"></div>
      <div id="browse-rarity-filters" class="type-filter-row"></div>
    </div>
    <div id="browse-grid" class="card-grid"></div>
  </section>

  <section id="tab-collection" class="tab-panel">
    <div class="sticky-controls">
      <div class="browse-controls">
        <label class="field field-grow">
          Filter your collection
          <div class="input-clear-wrap">
            <input type="text" id="collection-filter" placeholder="Search name, edition, or type…">
            <button type="button" id="collection-filter-clear" class="input-clear-btn" title="Clear">&times;</button>
          </div>
        </label>
        <label class="field">
          Sort by
          <select id="collection-sort">
            <option value="">Default order</option>
            <option value="cmc-asc">Mana Cost: Low → High</option>
            <option value="cmc-desc">Mana Cost: High → Low</option>
          </select>
        </label>
        <button id="btn-merge-toggle-collection" class="btn toggle-btn" title="Show one entry per card name instead of one per printing">Merge duplicate printings</button>
        <span id="collection-status" class="status-text"></span>
      </div>
      <hr class="controls-divider">
      <div id="collection-type-filters" class="type-filter-row"></div>
      <div id="collection-color-filters" class="type-filter-row"></div>
      <div id="collection-rarity-filters" class="type-filter-row"></div>
    </div>
    <div id="collection-grid" class="card-grid"></div>
  </section>

  <section id="tab-deckbuilder" class="tab-panel">
    <div class="deckbuilder-layout">
      <div class="deckbuilder-pool">
        <div class="sticky-controls">
          <div class="browse-controls">
            <label class="field field-grow">
              Add from your collection
              <div class="input-clear-wrap">
                <input type="text" id="deck-pool-filter" placeholder="Search owned cards…">
                <button type="button" id="deck-pool-filter-clear" class="input-clear-btn" title="Clear">&times;</button>
              </div>
            </label>
            <button id="btn-merge-toggle-deckbuilder" class="btn toggle-btn" title="Show one entry per card name instead of one per printing">Merge duplicate printings</button>
          </div>
        </div>
        <div id="deck-pool-grid" class="card-grid card-grid-compact"></div>
      </div>
      <div class="deckbuilder-current">
        <div class="deck-meta">
          <input type="text" id="deck-name" placeholder="Deck name…" class="deck-name-input">
          <button id="btn-new-deck" class="btn btn-ghost">New</button>
          <button id="btn-save-deck" class="btn btn-primary">Save Deck</button>
        </div>
        <div id="deck-stats" class="deck-stats"></div>
        <ul id="deck-list" class="deck-list"></ul>
      </div>
    </div>
  </section>

  <section id="tab-decks" class="tab-panel">
    <ul id="decks-list" class="decks-list"></ul>
  </section>

</main>

<div id="card-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-content">
    <button id="modal-close" class="modal-close">&times;</button>
    <button id="modal-prev" class="modal-nav modal-nav-prev" title="Previous version">&#8249;</button>
    <div id="modal-body"></div>
    <button id="modal-next" class="modal-nav modal-nav-next" title="Next version">&#8250;</button>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/scryfall.js"></script>
<script src="js/card-view.js"></script>
<script src="js/card-filters.js"></script>
<script src="js/ui-browse.js"></script>
<script src="js/ui-collection.js"></script>
<script src="js/ui-deckbuilder.js"></script>
<script src="js/ui-decks.js"></script>
<script src="js/app.js"></script>
</body>
</html>
