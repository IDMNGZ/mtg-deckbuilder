<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MTG Deck Builder</title>
<meta name="theme-color" content="#0a0c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MTG Deck">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="css/landing.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<script src="js/landing-backgrounds.js"></script>
<script src="js/version.js"></script>
<script>
  // Runs before the body paints, so there's no flash of the fallback background
  // before swapping to the randomly chosen one.
  (function () {
    if (typeof LANDING_BACKGROUNDS === "undefined" || LANDING_BACKGROUNDS.length === 0) return;
    var choice = LANDING_BACKGROUNDS[Math.floor(Math.random() * LANDING_BACKGROUNDS.length)];
    // Resolve to an absolute URL against this page's location before handing it to CSS -
    // a relative url() inside a custom property resolves against whichever stylesheet
    // consumes it (css/landing.css), not where the value was set, which would otherwise
    // silently point at the wrong folder.
    var absoluteUrl = new URL(choice, location.href).href;
    document.documentElement.style.setProperty("--landing-bg", "url('" + absoluteUrl + "')");
  })();
</script>
</head>
<body class="landing-page">
  <main>
    <h1 class="landing-title">Magic The Gathering<br>Deck Builder</h1>
    <div class="landing-actions">
      <a href="app.html" class="landing-enter-btn">Enter</a>
      <button type="button" id="btn-share" class="landing-share-btn" title="Share this app">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
        Share
      </button>
    </div>
    <span id="share-feedback" class="landing-share-feedback" aria-live="polite"></span>
    <p class="landing-subtitle">Created by Ian Dominguez</p>
  </main>
  <div class="landing-appinfo">
    <div>MTG Deck Builder <span id="landing-version"></span> - card data via <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a></div>
    <div>&copy; 2026 Ian Dominguez / Rogue Theory Studio. All rights reserved.</div>
  </div>
  <script src="js/share.js"></script>
  <script src="js/landing-fit.js"></script>
  <script>
    // Deferred to DOMContentLoaded (unlike the background-picker script above) since this
    // one needs the button/version elements to actually exist in the DOM.
    document.addEventListener("DOMContentLoaded", function () {
      ShareApp.wire(document.getElementById("btn-share"), document.getElementById("share-feedback"));
      document.getElementById("landing-version").textContent = APP_VERSION;
      LandingFit.init();
    });
  </script>
</body>
</html>
