<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="36%" r="75%">
      <stop offset="0%" stop-color="#2a3a6e"/>
      <stop offset="45%" stop-color="#16203f"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </radialGradient>
    <radialGradient id="medallionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a536" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#c9a536" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c9a536" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1600" fill="url(#bgGrad)"/>

  <!-- card-style double border frame -->
  <rect x="40" y="40" width="1120" height="1520" rx="36" fill="none" stroke="#c9a536" stroke-opacity="0.35" stroke-width="3"/>
  <rect x="58" y="58" width="1084" height="1484" rx="28" fill="none" stroke="#c9a536" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- central glow -->
  <circle cx="600" cy="620" r="420" fill="url(#medallionGlow)"/>

  <!-- concentric medallion rings -->
  <circle cx="600" cy="620" r="300" fill="none" stroke="#c9a536" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="600" cy="620" r="260" fill="none" stroke="#7c8cff" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="600" cy="620" r="180" fill="none" stroke="#c9a536" stroke-opacity="0.6" stroke-width="2"/>

  <!-- 8-point compass star -->
  <g transform="translate(600,620)" fill="#c9a536" fill-opacity="0.55">
    <polygon points="0,-260 18,-40 0,0 -18,-40"/>
    <polygon points="0,260 18,40 0,0 -18,40"/>
    <polygon points="-260,0 -40,18 0,0 -40,-18"/>
    <polygon points="260,0 40,18 0,0 40,-18"/>
    <polygon points="-184,-184 -30,-14 0,0 -14,-30" opacity="0.8"/>
    <polygon points="184,184 30,14 0,0 14,30" opacity="0.8"/>
    <polygon points="-184,184 -14,30 0,0 -30,14" opacity="0.8"/>
    <polygon points="184,-184 14,-30 0,0 30,-14" opacity="0.8"/>
  </g>
  <circle cx="600" cy="620" r="50" fill="#0a0c14" stroke="#c9a536" stroke-width="3"/>
  <circle cx="600" cy="620" r="34" fill="none" stroke="#7c8cff" stroke-width="2"/>

  <!-- scattered sparkles -->
  <g fill="#e9e9ee" fill-opacity="0.45">
    <path d="M180,220 l5,15 l15,5 l-15,5 l-5,15 l-5,-15 l-15,-5 l15,-5 z"/>
    <path d="M980,300 l6,18 l18,6 l-18,6 l-6,18 l-6,-18 l-18,-6 l18,-6 z"/>
    <path d="M240,900 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 z"/>
    <path d="M960,1020 l5,14 l14,5 l-14,5 l-5,14 l-5,-14 l-14,-5 l14,-5 z"/>
    <path d="M140,1240 l6,17 l17,6 l-17,6 l-6,17 l-6,-17 l-17,-6 l17,-6 z"/>
    <path d="M1040,1260 l4,13 l13,4 l-13,4 l-4,13 l-4,-13 l-13,-4 l13,-4 z"/>
    <path d="M600,1380 l5,15 l15,5 l-15,5 l-5,15 l-5,-15 l-15,-5 l15,-5 z"/>
    <path d="M340,150 l4,11 l11,4 l-11,4 l-4,11 l-4,-11 l-11,-4 l11,-4 z"/>
    <path d="M860,140 l4,11 l11,4 l-11,4 l-4,11 l-4,-11 l-11,-4 l11,-4 z"/>
  </g>
</svg>
